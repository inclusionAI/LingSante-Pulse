[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lingsante-pulse"
version = "1.4.0"
description = "LingSante-Pulse waveform and continuous-glucose representation toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LEGAL.md", "docs/cgm/NOTICE.md"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"lingsante_pulse.cgm" = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
